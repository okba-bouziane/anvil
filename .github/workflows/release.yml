name: Release

# Builds the app for every system when a version tag is pushed, and attaches it to a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/mac-arm64/Anvil.app "dist/Anvil-${GITHUB_REF_NAME#v}-mac-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
