name: Release

# Builds the app for every system when a version tag is pushed, and attaches it to a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/mac-arm64/Pitoo.app dist/Pitoo-mac-arm64.zip
          # Versions from before the rename update from these names, and expect this folder layout.
          mkdir legacy
          ditto dist/mac-arm64/Pitoo.app legacy/Anvil.app
          ln -s Pitoo legacy/Anvil.app/Contents/MacOS/Anvil
          codesign --force --deep --sign - legacy/Anvil.app
          ditto -c -k --keepParent legacy/Anvil.app dist/Anvil-mac-arm64.zip
      - name: Copy the installers under their old names
        if: runner.os != 'macOS'
        shell: bash
        run: |
          for file in dist/Pitoo-*.exe dist/Pitoo-*.AppImage dist/Pitoo-*.deb; do
            [ -e "$file" ] && cp "$file" "${file/Pitoo-/Anvil-}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
